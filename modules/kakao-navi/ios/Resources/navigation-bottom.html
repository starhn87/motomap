<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
  <style>
    :root { color-scheme: light dark; --bg: #fff; --floating-bg: rgba(255,255,255,.8); --bar-bg: #fafafa; --toast-bg: #18181b; --ink: #18181b; --muted: #71717a; --line: #e4e4e7; --brand: #18181b; --on-brand: #fff; --volume-blue: #1268fa; --track: #e4e4e7; --safe: 0px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none; user-select: none; }
    button, input { font: inherit; }
    button { border: 0; background: none; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:active { background: #71717a18; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    button:disabled { opacity: .36; }
    svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .panel { position: absolute; bottom: 0; width: 100%; height: 68px; background: var(--bar-bg); border: 1px solid var(--line); border-radius: 16px; padding-bottom: var(--safe); }
    .panel.expanded { background: var(--bg); height: 100%; border-radius: 18px 18px 0 0; border-bottom: 0; padding-bottom: 0; }
    .toast { position: absolute; z-index: 2; bottom: 0; inset-inline: 0; height: 68px; display: flex; align-items: center; justify-content: center; padding: 0 16px; border-radius: 16px; background: var(--toast-bg); color: #fafafa; font-size: 15px; font-weight: 650; text-align: center; pointer-events: none; }
    .toast[hidden] { display: none; }
    .recenter { position: absolute; top: 0; left: calc(50% - 66px); width: 132px; height: 44px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--floating-bg); border: 1px solid var(--line); border-radius: 22px; font-size: 15px; font-weight: 650; }
    .recenter[hidden] { display: none; }
    .recenter svg { width: 20px; height: 20px; }
    .bar { height: 68px; display: grid; grid-template-columns: 48px minmax(0, 1fr) 56px; align-items: center; gap: 2px; padding: 0 8px; }
    .bar button { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 24px; }
    .bar button svg { width: 23px; height: 23px; }
    .bar #menuButton { width: 56px; height: 56px; border-radius: 28px; }
    .bar #menuButton svg { width: 32px; height: 32px; stroke-width: 2; }
    .summary { text-align: center; min-width: 0; touch-action: pan-x; }
    .destination { white-space: nowrap; flex-wrap: nowrap; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 650; line-height: 23px; color: var(--ink); min-width: 0; }
    .placeName { min-width: 0; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .placeIcon { width: 21px; height: 21px; color: var(--ink); stroke-width: 2; }
    .placeIcon[hidden] { display: none; }
    .metrics { display: flex; justify-content: center; align-items: baseline; gap: 6px; line-height: 34px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .arrival { font-size: 28px; font-weight: 750; letter-spacing: -.6px; }
    .timeUnit { font-size: 18px; font-weight: 650; margin: 0 2px; letter-spacing: 0; }
    .distance { font-size: 21px; font-weight: 650; }
    .status { font-size: 14px; font-weight: 650; line-height: 24px; overflow: hidden; text-overflow: ellipsis; }
    #drawer { display: none; height: 100%; padding: 0 20px calc(14px + var(--safe)); }
    .expanded #drawer { display: flex; flex-direction: column; }
    .expanded .bar { display: none; }
    .sheetHeader { height: 30px; flex-shrink: 0; position: relative; touch-action: pan-x; }
    .handle { position: absolute; top: 9px; left: calc(50% - 16px); width: 32px; height: 4px; border-radius: 4px; background: #d4d4d8; }
    .sheetBody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .volumeLabel { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 650; padding: 2px 0 0; }
    output { color: var(--muted); font-size: 12px; font-weight: 500; }
    .volumeRange { display: flex; align-items: center; gap: 12px; height: 48px; color: #71717a; }
    .volumeRange svg { width: 18px; height: 18px; }
    .mute [hidden] { display: none; }
    .mute { width: 44px; height: 44px; display: grid; place-items: center; flex-shrink: 0; border-radius: 22px; }
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 44px; flex: 1; min-width: 0; margin: 0; touch-action: pan-x; }
    input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(to right, var(--volume-blue) var(--volume, 100%), var(--track) var(--volume, 100%)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; margin-top: -9.5px; background: #fff; border: 1px solid #e4e4e7; box-shadow: 0 1px 4px #18181b26; }
    .routeActions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .routeActions button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-weight: 650; }
    .routeActions svg { width: 22px; height: 22px; }
    .end { flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; min-height: 48px; margin-top: 14px; border-radius: 8px; background: var(--brand); color: var(--on-brand); font-size: 15px; font-weight: 650; }
    .end svg { width: 18px; height: 18px; }
    .end:active { opacity: .82; background: var(--brand); }
    @media (max-width: 320px) { .arrival { font-size: 24px; } .timeUnit { font-size: 16px; } .distance { font-size: 18px; } }
    @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --floating-bg: rgba(10,10,10,.8); --bar-bg: #18181b; --toast-bg: #0a0a0a; --ink: #fafafa; --muted: #a1a1aa; --line: #27272a; --brand: #fafafa; --on-brand: #0a0a0a; --volume-blue: #3984ff; --track: #3f3f46; } .volumeRange { color: #d4d4d8; } }
  </style>
</head>
<body>
  <button class="recenter" id="recenter" data-action="recenter" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m20 4-6 16-3-7-7-3z" fill="currentColor" stroke-linejoin="round"/></svg><span>현재 위치로</span></button>
  <main class="panel" id="panel">
    <section id="drawer" aria-label="길안내 메뉴">
      <div class="sheetHeader dragArea">
        <div class="handle"></div>
      </div>
      <div class="sheetBody">
        <div class="volumeLabel"><label for="volume">안내 음량</label><output id="volumeValue">100%</output></div>
        <div class="volumeRange">
          <button id="mute" class="mute" aria-label="안내 음소거"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="muteWaves" d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/><path id="muteSlash" hidden d="m16 9 5 6m0-6-5 6"/></svg></button>
          <input type="range" id="volume" aria-label="안내 음량" min="0" max="100" value="100">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg>
        </div>
        <div class="routeActions">
          <button data-action="routePreview"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20V8a3 3 0 0 1 3-3h2M7 2l3 3-3 3M19 4v12a3 3 0 0 1-3 3h-2M17 16l-3 3 3 3"/></svg><span>다른 경로</span></button>
          <button data-action="routeEdit" id="routeEdit"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>경로 편집</span></button>
        </div>
      </div>
      <button class="end" data-action="end"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m20 4-6 16-3-7-7-3z"/></svg><span>길안내 종료</span></button>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <footer class="bar">
      <button data-action="refresh" aria-label="현재 경로 새로고침"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1 7M19 3v5h-5"/></svg></button>
      <div class="summary dragArea" aria-live="off">
        <div class="destination" id="destination" aria-label="현재 위치">
          <svg class="placeIcon" id="currentIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="m20 4-6 16-3-7-7-3z" fill="currentColor" stroke-linejoin="round"/></svg>
          <svg class="placeIcon" id="goalIcon" hidden aria-hidden="true" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5" fill="currentColor" stroke="none"/></svg>
          <span class="placeName" id="placeName"></span>
        </div>
        <div class="metrics"><div class="arrival" id="arrival">안내 준비 중</div><div class="distance" id="distance"></div></div>
      </div>
      <button data-action="menu" id="menuButton" aria-label="길안내 메뉴 열기" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </footer>
  </main>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const send = (action, extra = {}) => window.webkit.messageHandlers.motomapBottom.postMessage({ action, ...extra });
      let expanded = false;
      let menuOpen = false;
      let latestState = {};
      let showGoal = false;
      const showLocation = () => {
        const current = (latestState.currentLocationName || '').trim();
        const destinationOnly = !current || current === '현재 위치';
        const displayGoal = showGoal || destinationOnly;
        $('placeName').textContent = displayGoal ? (latestState.goalName || '목적지') : current;
        $('currentIcon').toggleAttribute('hidden', displayGoal);
        $('goalIcon').toggleAttribute('hidden', !displayGoal);
        $('destination').setAttribute('aria-label', (displayGoal ? '목적지 ' : '현재 위치 ') + $('placeName').textContent);
      };
      setInterval(() => {
        if (!expanded && !document.hidden) { showGoal = !showGoal; showLocation(); }
      }, 5000);
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => send(button.dataset.action)));
      const volume = $('volume');
      const showVolume = value => {
        const percent = Math.round(Math.max(0, Math.min(100, Number(value))));
        $('volumeValue').textContent = percent + '%';
        volume.style.setProperty('--volume', percent + '%');
        $('mute').setAttribute('aria-pressed', String(percent === 0));
        $('mute').setAttribute('aria-label', percent === 0 ? '안내 음량 100%로 켜기' : '안내 음소거');
        $('muteWaves').toggleAttribute('hidden', percent === 0);
        $('muteSlash').toggleAttribute('hidden', percent !== 0);
      };
      $('mute').addEventListener('click', () => {
        volume.value = Number(volume.value) === 0 ? 100 : 0;
        showVolume(volume.value);
        send('volume', { value: Number(volume.value) / 100 });
      });
      volume.addEventListener('input', () => {
        showVolume(volume.value);
        send('volume', { value: Number(volume.value) / 100 });
      });
      // 범위 입력은 건드리지 않고 핸들과 요약 영역에서만 시트를 여닫는다.
      document.querySelectorAll('.dragArea').forEach(area => {
        let start = null;
        area.addEventListener('pointerdown', event => {
          if (!event.target.closest('button')) {
            start = event.clientY;
            if (event.isTrusted) area.setPointerCapture(event.pointerId);
          }
        });
        area.addEventListener('pointerup', event => {
          if (start !== null) {
            const delta = event.clientY - start;
            if ((expanded && delta > 28) || (!expanded && delta < -28)) send('menu');
          }
          start = null;
        });
        area.addEventListener('pointercancel', () => { start = null; });
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && expanded) send('menu');
      });
      let toastTimer;
      window.MotoMapBottom = {
        toast(message) {
          clearTimeout(toastTimer);
          $('toast').textContent = message;
          $('toast').hidden = false;
          toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2200);
        },
        render(state) {
          const wasMenuOpen = menuOpen;
          menuOpen = !!state.menuOpen;
          expanded = !!state.expanded;
          $('panel').classList.toggle('expanded', expanded);
          $('recenter').hidden = expanded || !state.showRecenter;
          document.documentElement.style.setProperty('--safe', Math.max(0, state.bottomInset || 0) + 'px');
          $('menuButton').setAttribute('aria-expanded', String(menuOpen));
          $('drawer').setAttribute('aria-hidden', String(!expanded));
          if (wasMenuOpen !== menuOpen) {
            if (expanded && menuOpen) volume.focus({ preventScroll: true });
            else if (!expanded && !menuOpen) $('menuButton').focus({ preventScroll: true });
          }
          if (document.activeElement !== volume) {
            volume.value = Math.round((state.volume ?? 1) * 100);
            showVolume(volume.value);
          }
          $('routeEdit').disabled = !state.canRouteEdit || !!state.busy;
          document.querySelector('[data-action=routePreview]').disabled = !!state.busy;
          latestState = state;
          showLocation();
          const seconds = state.remainingTime;
          const meters = state.remainingDistance;
          const valid = Number.isFinite(seconds) && Number.isFinite(meters) && seconds >= 0 && meters >= 0;
          if (state.status) {
            $('arrival').className = 'status';
            $('arrival').textContent = state.status;
            $('arrival').removeAttribute('aria-label');
            $('distance').textContent = '';
          } else if (valid) {
            const minutes = Math.ceil(seconds / 60);
            $('arrival').className = 'arrival';
            $('arrival').replaceChildren();
            const appendTime = (value, label) => {
              const unit = document.createElement('span');
              unit.className = 'timeUnit'; unit.textContent = label;
              $('arrival').append(document.createTextNode(String(value)), unit);
            };
            if (minutes >= 60) appendTime(Math.floor(minutes / 60), '시간');
            if (minutes < 60 || minutes % 60) appendTime(minutes % 60, '분');
            $('arrival').setAttribute('aria-label', '남은 시간 ' + $('arrival').textContent);
            $('distance').textContent = meters >= 1000 ? (meters / 1000).toFixed(1) + 'km' : Math.round(meters) + 'm';
          } else {
            $('arrival').className = 'status';
            $('arrival').textContent = '안내 준비 중';
            $('arrival').removeAttribute('aria-label');
            $('distance').textContent = '';
          }
          document.querySelector('[data-action=refresh]').disabled = !!state.busy;
        }
      };
      send('ready');
    })();
  </script>
</body>
</html>
