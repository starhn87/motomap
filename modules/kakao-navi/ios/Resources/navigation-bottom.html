<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>
:root{color-scheme:light dark;--bg:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--safe:0px}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:transparent;color:var(--ink)}button,input{font:inherit}button{border:0;background:none;color:inherit;min-height:48px;touch-action:manipulation}button:active{background:#8882}button:disabled{opacity:.4}.panel{height:100%;display:flex;flex-direction:column;justify-content:flex-end;background:var(--bg);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding-bottom:var(--safe)}#drawer{display:none;overflow-y:auto;flex:1;min-height:0;padding:8px 16px}.expanded #drawer{display:block}.handle{height:4px;width:32px;border-radius:4px;background:var(--line);margin:0 auto 10px}.volume{display:flex;align-items:center;gap:12px;min-height:48px;border-bottom:1px solid var(--line);padding-bottom:8px}.volume label{font-size:13px;color:var(--muted);white-space:nowrap}input[type=range]{accent-color:#16a34a;flex:1;min-width:60px;height:44px}output{font-size:12px;min-width:32px;text-align:right}.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding-top:8px}.grid button{text-align:left;padding:12px 10px;font-size:15px;border-radius:10px}.end{color:#dc2626;border-top:1px solid var(--line);width:100%;text-align:center;margin-top:4px;font-size:15px;font-weight:600}.bar{display:flex;align-items:center;gap:6px;flex-shrink:0;height:80px;padding:8px 12px;border-top:1px solid var(--line)}.refresh{width:48px;flex-shrink:0;font-size:27px;border-radius:24px}.summary{flex:1;min-width:0;padding:0 4px}.primary{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}.meta{font-size:12px;color:var(--muted);margin-top:4px}.status{font-size:13px;font-weight:600;line-height:1.4}.menu{min-width:64px;padding:8px;font-size:14px;font-weight:600;border-radius:12px}.menu span{display:block;font-size:16px;margin-bottom:2px}@media(prefers-color-scheme:dark){:root{--bg:#18181b;--ink:#fafafa;--muted:#a1a1aa;--line:#3f3f46}}
</style></head><body><main class="panel" id="panel"><section id="drawer" aria-label="길안내 메뉴"><div class="handle"></div><div class="volume"><label for="volume">안내 음량</label><input type="range" id="volume" aria-label="안내 음량" min="0" max="100" value="100"><output id="volumeValue">100%</output></div><div class="grid"><button data-action="hazard">위험 제보</button><button data-action="routePreview">경로 다시 찾기</button><button data-action="destination">목적지 변경</button><button data-action="vias">경유지 편집</button></div><button class="end" data-action="end">길안내 종료</button></section><footer class="bar"><button class="refresh" data-action="refresh" aria-label="현재 경로 새로고침">↻</button><div class="summary" aria-live="polite"><div class="primary" id="duration">안내 준비 중</div><div class="meta" id="detail"></div></div><button class="menu" data-action="menu" aria-expanded="false"><span id="chevron">⌃</span><span id="menuLabel">메뉴</span></button></footer></main><script>
(()=>{const $=id=>document.getElementById(id);const send=(action,extra={})=>window.webkit.messageHandlers.motomapBottom.postMessage({action,...extra});document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>send(button.dataset.action)));const volume=$('volume');volume.addEventListener('input',()=>{$('volumeValue').textContent=volume.value+'%';send('volume',{value:Number(volume.value)/100});});window.MotoMapBottom={render(state){$('panel').classList.toggle('expanded',!!state.expanded);document.documentElement.style.setProperty('--safe',Math.max(0,state.bottomInset||0)+'px');const menu=document.querySelector('[data-action=menu]');menu.setAttribute('aria-expanded',String(!!state.expanded));$('chevron').textContent=state.expanded?'⌄':'⌃';$('menuLabel').textContent=state.expanded?'닫기':'메뉴';if(document.activeElement!==volume){volume.value=Math.round((state.volume??1)*100);$('volumeValue').textContent=volume.value+'%';}const seconds=state.remainingTime,meters=state.remainingDistance;const valid=Number.isFinite(seconds)&&Number.isFinite(meters)&&seconds>=0&&meters>=0;if(state.status){$('duration').textContent=state.status;$('duration').className='status';$('detail').textContent=state.detail||'';}else if(valid){const minutes=Math.ceil(seconds/60);$('duration').className='primary';$('duration').textContent=minutes>=60?Math.floor(minutes/60)+'시간 '+minutes%60+'분':minutes+'분';const eta=new Date(Date.now()+seconds*1000);$('detail').textContent=(meters>=1000?(meters/1000).toFixed(1)+'km':Math.round(meters)+'m')+' · '+eta.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 도착';}else{$('duration').textContent='안내 준비 중';$('detail').textContent='';}document.querySelector('[data-action=refresh]').disabled=!!state.busy;document.querySelectorAll('.grid button').forEach(button=>button.disabled=!!state.busy||(button.dataset.action==='vias'&&state.canEditVias===false));const viaButton=document.querySelector('[data-action=vias]');viaButton.textContent=state.canEditVias===false?'코스 경유지 고정':'경유지 편집';}};send('ready');})();
</script></body></html>
